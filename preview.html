
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عذراً، لا يمكن الدخول</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Arial, sans-serif;
            background-color: #fff;
            background-image: url("https://png.pngtree.com/png-vector/20240325/ourmid/pngtree-cute-thinking-emoji-png-image_12233041.png");
            background-repeat: repeat;
            background-size: 120px;
            background-position: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 22px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.13);
        }

        .emoji {
            width: 190px;
            max-width: 75%;
            height: auto;
            margin-bottom: 25px;
            object-fit: contain;
        }

        .message {
            color: #292929;
            font-size: 23px;
            font-weight: bold;
            line-height: 2;
        }

        .footer {
            margin-top: 15px;
            font-size: 30px;
            letter-spacing: 5px;
        }

        @media (max-width: 480px) {
            .message {
                font-size: 19px;
            }

            .emoji {
                width: 155px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            class="emoji"
            src="https://img.magnific.com/psd-premium/emoji-pensante-gafas-negras-mirando-arriba-mano-barbilla_1116566-4064.jpg?semt=ais_hybrid&w=740&q=80"
            alt="Thinking Emoji"
        >

        <div class="message">
            عذراً لا يمكن الدخول<br>
            الرجاء المحاولة مرة أخرى<br>
            ليس لدينا وقت حالياً
        </div>

        <div class="footer">
            🤔 🤔
        </div>

    </div>

</body>
</html>
